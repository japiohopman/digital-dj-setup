name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/digital-dj-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/digital-dj-preview.log
          exit 1

      - name: Capture mobile and desktop screenshots
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p screenshots
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome/Chromium binary is available on this runner."
            exit 1
          fi
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --window-size=390,844 --screenshot=screenshots/turntable-mobile.png http://127.0.0.1:4173/
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --window-size=1440,1000 --screenshot=screenshots/turntable-desktop.png http://127.0.0.1:4173/

      - name: Upload visual review screenshots
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: turntable-visual-review
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 7
