name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Verify installable PWA output
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('dist/manifest.webmanifest', 'utf8'));
          if (manifest.display !== 'standalone' || manifest.start_url !== './' || manifest.scope !== './') {
            throw new Error('PWA manifest must use standalone mode with a deployment-relative scope.');
          }
          for (const size of ['192x192', '512x512']) {
            const icon = manifest.icons.find((item) => item.sizes === size && item.type === 'image/png');
            const iconPath = icon && new URL(icon.src, 'https://example.test/manifest.webmanifest').pathname;
            if (!iconPath || !existsSync('dist' + iconPath)) {
              throw new Error('Missing install icon: ' + size);
            }
          }
          for (const asset of [
            'dist/sw.js',
            'dist/favicon.svg',
            'dist/sounds/vinyl_loop.wav',
            'dist/sounds/battle_amo/scratch_making_me_itch.mp3',
            'dist/sounds/battle_amo/super_duck_breaks.mp3',
          ]) {
            if (!existsSync(asset)) throw new Error('Missing PWA shell resource: ' + asset);
          }
          const worker = readFileSync('dist/sw.js', 'utf8');
          if (!worker.includes('digital-dj-shell-') || !worker.includes('PRECACHE_URLS')) {
            throw new Error('The generated versioned app-shell worker is missing.');
          }
          for (const track of ['scratch_making_me_itch.mp3', 'super_duck_breaks.mp3']) {
            if (!worker.includes('/sounds/battle_amo/' + track)) {
              throw new Error('Battle Ammo track is missing from the offline precache: ' + track);
            }
          }
          if (worker.includes('user-audio-preview')) {
            throw new Error('User-selected audio must not be added to the precache.');
          }
          console.log('Standalone manifest, icons, versioned worker and bundled app sounds verified.');
          NODE

      - name: Verify GitHub Pages project-path build
        run: |
          VITE_BASE_PATH=/digital-dj-setup/ npm run build -- --outDir dist-pages
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync } from 'node:fs';

          const base = '/digital-dj-setup/';
          const manifest = JSON.parse(readFileSync('dist-pages/manifest.webmanifest', 'utf8'));
          if (manifest.display !== 'standalone' || manifest.start_url !== './' || manifest.scope !== './') {
            throw new Error('GitHub Pages manifest must retain its relative standalone scope.');
          }
          for (const size of ['192x192', '512x512']) {
            const icon = manifest.icons.find((item) => item.sizes === size);
            const iconPath = icon && new URL(icon.src, 'https://example.test/digital-dj-setup/manifest.webmanifest').pathname;
            const outputPath = iconPath?.startsWith(base) ? iconPath.slice(base.length) : '';
            if (!outputPath || !existsSync('dist-pages/' + outputPath)) {
              throw new Error('GitHub Pages icon is missing or outside the project path: ' + size);
            }
          }
          const html = readFileSync('dist-pages/index.html', 'utf8');
          if (!html.includes('/digital-dj-setup/assets/') || !html.includes('/digital-dj-setup/manifest.webmanifest')) {
            throw new Error('GitHub Pages HTML does not reference project-scoped assets.');
          }
          const cssFile = readdirSync('dist-pages/assets').find((file) => file.endsWith('.css'));
          if (!cssFile) throw new Error('No CSS bundle was emitted for GitHub Pages.');
          const css = readFileSync('dist-pages/assets/' + cssFile, 'utf8');
          if (!css.includes('/digital-dj-setup/turntable/')) {
            throw new Error('Turntable CSS artwork URLs were not rewritten under the GitHub Pages base path.');
          }
          const worker = readFileSync('dist-pages/sw.js', 'utf8');
          if (!worker.includes('"/digital-dj-setup/"') ||
              !worker.includes('"/digital-dj-setup/turntable/landscape/tt_case_and_lighting.png"')) {
            throw new Error('GitHub Pages worker does not precache resources under the project path.');
          }
          for (const track of ['scratch_making_me_itch.mp3', 'super_duck_breaks.mp3']) {
            if (!worker.includes('"/digital-dj-setup/sounds/battle_amo/' + track + '"')) {
              throw new Error('GitHub Pages worker is missing a Battle Ammo track: ' + track);
            }
          }
          if (worker.includes('user-audio-preview')) {
            throw new Error('User-selected audio must never be added to the app-shell cache.');
          }
          console.log('GitHub Pages base path, manifest icons and scoped service worker verified.');
          NODE

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/digital-dj-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/digital-dj-preview.log
          exit 1

      - name: Capture portrait, 90-degree mobile landscape and desktop screenshots
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p screenshots
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome/Chromium binary is available on this runner."
            exit 1
          fi
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --window-size=390,844 --screenshot=screenshots/dual-deck-portrait-390x844.png http://127.0.0.1:4173/
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --window-size=390,844 --screenshot=screenshots/mixer-portrait-390x844.png "http://127.0.0.1:4173/?view=mixer"
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --window-size=844,390 --screenshot=screenshots/dual-deck-90-degree-landscape-844x390.png http://127.0.0.1:4173/
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --window-size=844,320 --screenshot=screenshots/dual-deck-short-landscape-844x320.png http://127.0.0.1:4173/
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --window-size=1440,1000 --screenshot=screenshots/dual-deck-desktop-1440x1000.png http://127.0.0.1:4173/

      - name: Upload visual review screenshots
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: dual-deck-90-degree-visual-review
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 7
